services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: resolveiq
      POSTGRES_PASSWORD: resolveiq
      POSTGRES_DB: resolveiq
    ports: ["5432:5432"]
    volumes: ["resolveiq_pg:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://resolveiq:resolveiq@postgres:5432/resolveiq
      RETRIEVER_PROVIDER: local
      EMBEDDING_PROVIDER: local
      CORS_ORIGINS: http://localhost:5173
    depends_on: [postgres]
    ports: ["8000:8000"]
volumes:
  resolveiq_pg:
